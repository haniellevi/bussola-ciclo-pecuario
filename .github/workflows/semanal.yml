name: Rodada semanal

on:
  schedule:
    - cron: "0 23 * * 1-5" # coleta diária, 20h de Brasília (dias úteis)
    - cron: "0 12 * * 1" # previsão e relatório, segunda 9h de Brasília
  push:
    branches: [main]
    paths: ["data/manual/cepea/**"] # plano B: planilha do Cepea enviada à mão
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: semanal
  cancel-in-progress: false

env:
  # Previsão e relatório só na rodada de segunda ou quando disparado à mão.
  RODADA_SEMANAL: ${{ github.event.schedule == '0 12 * * 1' || github.event_name == 'workflow_dispatch' }}

jobs:
  rodada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Coletar Cepea (via Notícias Agrícolas), Banco Central e IBGE
        # Se uma fonte falhar, segue com o último dado salvo; a conferência avisa no relatório.
        continue-on-error: true
        run: node pipeline/coletar.ts

      - name: Ler planilhas do Cepea enviadas à mão
        if: github.event_name == 'push'
        run: |
          pip install xlrd==2.0.1
          python pipeline/ler_cepea.py

      - name: Notícias da semana (leitura por IA se houver chave)
        if: env.RODADA_SEMANAL == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELO_NOTICIAS: ${{ vars.MODELO_NOTICIAS }}
        run: node pipeline/noticias.ts

      - name: Conferir, prever, comparar
        if: env.RODADA_SEMANAL == 'true'
        run: node pipeline/semanal.ts

      - name: Atualizar dados do app
        run: node pipeline/painel.ts

      - name: Salvar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "dados: coleta $(date -u +%F)"
          # Alguém pode ter enviado mudanças durante a rodada: junta antes de enviar.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1

      - name: Relatório como issue (o GitHub avisa por e-mail)
        if: env.RODADA_SEMANAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="$(head -1 data/semanal/relatorio.md | sed 's/^# //')"
          printf '\n@%s\n' "${{ github.repository_owner }}" >> data/semanal/relatorio.md
          gh label create semanal --color 0E8A16 --description "Relatório semanal" --force
          numero="$(gh issue list --label semanal --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')"
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file data/semanal/relatorio.md
          else
            for antigo in $(gh issue list --label semanal --state open --json number --jq '.[].number'); do
              gh issue close "$antigo" --comment "Substituído pelo relatório da semana nova."
            done
            gh issue create --title "$titulo" --label semanal --body-file data/semanal/relatorio.md
          fi

      - name: Avisar se a coleta falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Robô falhou em $(date -u +%F)" \
            --body "A rodada falhou. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} @${{ github.repository_owner }}"
